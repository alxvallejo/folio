<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Folio share image</title>

      /* The Klein and Riso shots overlapping on Riso paper; capture.mjs renders this at 1600×1000. */

      .front { left: 560px; top: 235px; }
    </style>
  </head>
  <body>
    <img class="back" src="/docs/screenshots/klein.png" alt="" />
    <img class="front" src="/docs/screenshots/riso.png" alt="" />
  </body>
